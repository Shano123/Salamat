# Render Blueprint: one free PostgreSQL database + the web app, for testing.
# Render dashboard → New → Blueprint → pick this repository and branch.
databases:
  - name: salamat-db
    plan: free
    region: frankfurt
    databaseName: salamat
    user: salamat

services:
  - type: web
    name: salamat
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Applies migrations and loads the demo hospital (safe to re-run), then starts the app.
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: salamat-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/salamat-storage
